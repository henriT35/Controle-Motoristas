name: painel-motoristas

x-django-env: &django-env
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
  DJANGO_ALLOWED_HOSTS: "${PUBLIC_IP},localhost,127.0.0.1,web"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://${PUBLIC_IP}"
  DJANGO_SECURE_COOKIES: "0"
  DJANGO_SECURE_SSL_REDIRECT: "0"
  DATABASE_MODE: postgres
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: "${POSTGRES_DB}"
  DB_USER: "${POSTGRES_USER}"
  DB_PASSWORD: "${POSTGRES_PASSWORD}"
  REDIS_URL: "redis://redis:6379/0"
  REDIS_CACHE_URL: "redis://redis:6379/1"
  CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-900}"
  CELERY_TASK_ALWAYS_EAGER: "0"
  TZ: "${TZ:-America/Belem}"
  SERVE_PROTECTED_MEDIA: "1"
  PANEL_PUBLIC_BASE_URL: "http://${PUBLIC_IP}"
  PERF_SQL_LOG: "${PERF_SQL_LOG:-0}"
  SSW_ROBOT_ENABLED: "1"
  SSW_ROBOT_DISPATCH_MODE: celery
  SSW_ROBOT_DIR: /app/robot_ssw
  SSW_ROBOT_UNIT: "${SSW_UNIT:-BEL}"
  SSW_ROBOT_OPTION: "036"
  SSW_ROBOT_EXCEL: "S"
  SSW_AUTO_SYNC_ENABLED: "${SSW_AUTO_SYNC_ENABLED:-1}"
  SSW_AUTO_SYNC_INTERVAL_MINUTES: "${SSW_AUTO_SYNC_INTERVAL_MINUTES:-120}"
  WHATSAPP_BRIDGE_EXTERNAL_SERVICE: "1"
  WHATSAPP_BRIDGE_TRUSTED_INTERNAL: "1"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      TZ: "${TZ:-America/Belem}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
      DJANGO_ADMIN_USERNAME: "${DJANGO_ADMIN_USERNAME:-admin}"
      DJANGO_ADMIN_PASSWORD: "${DJANGO_ADMIN_PASSWORD}"
      DJANGO_ADMIN_EMAIL: "${DJANGO_ADMIN_EMAIL:-admin@localhost}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      GUNICORN_MAX_REQUESTS: "${GUNICORN_MAX_REQUESTS:-1000}"
      GUNICORN_MAX_REQUESTS_JITTER: "${GUNICORN_MAX_REQUESTS_JITTER:-100}"
      STARTUP_RECONCILE: "${STARTUP_RECONCILE:-1}"
      STARTUP_SYNC_EVALUATION: "${STARTUP_SYNC_EVALUATION:-1}"
      STARTUP_WARMUP: "${STARTUP_WARMUP:-1}"
    command: ["bash", "/app/scripts/docker/web-entrypoint.sh"]
    volumes:
      - local_data:/app/local_data
      - media_data:/app/media
      - imports_data:/app/imports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).read()"]
      interval: 15s
      timeout: 7s
      retries: 12
      start_period: 60s
    stop_grace_period: 45s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *django-env
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - celery
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      - --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-200}
      - --hostname=worker@%h
    volumes:
      - local_data:/app/local_data
      - media_data:/app/media
      - imports_data:/app/imports
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *django-env
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/app/local_data/celerybeat-schedule"]
    volumes:
      - local_data:/app/local_data
      - imports_data:/app/imports
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  robot-worker:
    shm_size: "1gb"
    build:
      context: .
      dockerfile: Dockerfile.robot
    restart: unless-stopped
    environment:
      <<: *django-env
      SSW_EMPRESA: "${SSW_EMPRESA}"
      SSW_CPF: "${SSW_CPF}"
      SSW_USUARIO: "${SSW_USUARIO}"
      SSW_SENHA: "${SSW_SENHA}"
      SSW_URL: "${SSW_URL:-https://sistema.ssw.inf.br/bin/ssw0422}"
      SSW_UNIT: "${SSW_UNIT:-BEL}"
      SSW_REPORT_TYPE: ROMANEIOS
      SSW_OPTION: "036"
      ROBOT_HEADLESS: "${ROBOT_HEADLESS:-true}"
      ROBOT_SLOW_MO: "${ROBOT_SLOW_MO:-800}"
      ROBOT_ACTION_TIMEOUT_MS: "${ROBOT_ACTION_TIMEOUT_MS:-30000}"
      ROBOT_DOWNLOAD_TIMEOUT_MS: "${ROBOT_DOWNLOAD_TIMEOUT_MS:-120000}"
    volumes:
      - local_data:/app/local_data
      - imports_data:/app/imports
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s

  whatsapp:
    build:
      context: ./whatsapp_bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PANEL_BASE_DIR: /runtime
      PANEL_INTERNAL_URL: http://web:8000
      WHATSAPP_BAILEYS_LOG_LEVEL: "${WHATSAPP_BAILEYS_LOG_LEVEL:-warn}"
      WHATSAPP_SEND_DELAY_MS: "${WHATSAPP_SEND_DELAY_MS:-2500}"
    volumes:
      - local_data:/runtime/local_data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/bridge/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s

volumes:
  postgres_data:
  redis_data:
  local_data:
  media_data:
  imports_data:
