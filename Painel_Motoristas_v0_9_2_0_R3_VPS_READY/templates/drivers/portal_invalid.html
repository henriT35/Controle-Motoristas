{% load static %}<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso do motorista</title><link rel="stylesheet" href="{% static 'css/app.css' %}?v=0.9.2.0"></head><body class="driver-portal-body"><main class="driver-portal-shell compact-public-shell"><article class="panel portal-request-card"><span class="eyebrow">PAINEL MOTORISTAS</span><h1>Este link não está mais ativo</h1><p class="muted">Se você perdeu o acesso ou recebeu um link antigo, envie uma solicitação. Um coordenador precisa aprovar antes de um novo link ser gerado.</p><form method="post" action="{% url 'driver_portal_request_access' %}" class="stack-form">{% csrf_token %}<label>CPF<input name="cpf" inputmode="numeric" autocomplete="off" required placeholder="Somente números"></label><label>WhatsApp<input name="phone" inputmode="tel" required placeholder="DDD + número"></label><label>Motivo<textarea name="reason" rows="2" placeholder="Ex.: perdi meu link"></textarea></label><button class="btn btn-primary full" type="submit">Solicitar novo link</button></form><small class="muted">A solicitação não cria acesso automaticamente.</small></article></main></body></html>
